name: tourist_safety_app
description: Smart Tourist Safety Monitoring System - Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

flutter_native_splash:
  color: "#000000"
  image: assets/splash_logo.png

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase authentication and cloud user profiles
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.12

  # Networking
  http: ^1.2.0

  # Local storage (auth token, cached user)
  shared_preferences: ^2.2.2

  # Location
  geolocator: ^11.0.0
  permission_handler: ^11.3.0

  # Map (OpenStreetMap - no API key required)
  flutter_map: ^6.1.0
  latlong2: ^0.9.1

  # State management (lightweight)
  provider: ^6.1.2

  # Video splash
  video_player: ^2.9.2
  flutter_svg: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/logo.mp4
    - assets/splash_logo.png
