version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: guardian_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian_dev_password   # override in prod via env file / secrets
      POSTGRES_DB: guardian_go
    ports:
      - "5432:5432"
    volumes:
      - guardian_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian_go"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: guardian_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - guardian_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  guardian_pg_data:
  guardian_redis_data:
